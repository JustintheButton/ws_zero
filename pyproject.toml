[project]
name = "ws-zero"
version = "0.1.0"
description = "Small-scale AlphaZero chess, testing LLM-written weights (Weight-Space Programming) as an initialization"
readme = "README.md"
requires-python = "==3.12.*"
# Direct dependencies are pinned exactly; uv.lock pins everything else.
dependencies = [
    "chess==1.11.2",
    "jax==0.12.0.1; sys_platform == 'darwin'",
    "jax[cuda13]==0.12.0.1; sys_platform == 'linux'",
    "numpy==2.5.4",
    "pgx==2.6.0",
    "pyyaml==6.0.3",
    "torch==2.15.0",
    "wandb==0.31.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_zero"]

# Supported platforms: macOS (development) and Linux (WSL2 on the training PC). Native Windows is not supported.
[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

# PyTorch: the same version everywhere. On Linux, the CUDA 13.2 build (the RTX 5070 Ti needs CUDA >= 12.8, and
# the cu128 index stops at torch 2.11); needs a recent NVIDIA Windows driver. On macOS, the standard PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
